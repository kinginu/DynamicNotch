# XcodeGen spec for the DynamicNotch app (source of truth; the .xcodeproj is generated and
# git-ignored). Every check (this project, the CLT harness, FanControl): ../scripts/check.sh
#
#   cd DynamicNotchApp && xcodegen generate
#   xcodebuild -project DynamicNotch.xcodeproj -scheme DynamicNotch build
#   xcodebuild -project DynamicNotch.xcodeproj -scheme DynamicNotch test -only-testing:DynamicNotchAppTests
#
# Targets
#   DynamicNotch          the app (Sources/ incl. FanControlGlue/ + App/ + resources)
#   FanControlHelper      privileged helper, embedded in Contents/MacOS
#   DynamicNotchApp       static library of the app code without App/ (no @main) — test support only,
#                         never shipped. Same module name as the CLT harness library (Package.swift),
#                         so tests are written once: `@testable import DynamicNotchApp`.
#   DynamicNotchAppTests  host-less Swift Testing bundle over Tests/** (the app never launches)
#
# Keep `packages:` in sync with Package.swift (the Command Line Tools harness).
name: DynamicNotch

options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # App version (CFBundleShortVersionString / CFBundleVersion via Support/Info.plist). Bumped by
    # ../scripts/tag-release.sh <version>; the release workflow (.github/workflows/release.yml)
    # passes the same values from the tag: build number = major*10000 + minor*100 + patch.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "10001"
    # Apple Silicon only (FanControl refuses other CPUs): no x86_64 slice, also in Release.
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Release:
      # Xcode adds com.apple.security.get-task-allow to ad-hoc ("Sign to Run Locally") builds;
      # a released build must not be debuggable by other processes of the user, who could then
      # drive the helper through it (FanControl/docs/helper.md "Threat model").
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter
    revision: 5b6afde3f501a3da567e23bf7f23d562938a1809   # no tags; uses unsafeFlags
  # Fan Control integration (FanControl/docs/integration.md §1). Local package; not in Package.swift
  # (the CLT harness does not compile Sources/FanControlGlue/).
  FanControl:
    path: ../FanControl
    group: Packages   # keep the package reference out of the ../FanControl source groups
  # Removed 2026-10-20 (first-party replacements, BUILD-LOG.md): Sparkle, SmoothGradient, Lottie,
  # RichTextKit, CodeEditor (+ Highlightr), Defaults (→ SettingsStore).

targets:
  # MARK: - Privileged helper
  # FanControl/docs/integration.md §2, docs/helper.md §1. Same recipe as
  # FanControl/Tools/HelperSmokeApp/project.yml (validated with Xcode 26.6). Do NOT ship the
  # SwiftPM executable product of the same name: it lacks the embedded Info.plist.
  FanControlHelper:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ../FanControl/Sources/FanControlHelper
    dependencies:
      - package: FanControl
        product: FanControlCore
      - package: FanControl
        product: FanControlSMC
      - package: FanControl
        product: FanControlXPC
    settings:
      base:
        # Identity — the code-signing identifier must equal FanControlHelperConstants.helperIdentifier.
        PRODUCT_NAME: FanControlHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dynamicnotch.DynamicNotch.fanfi
        SKIP_INSTALL: YES
        # Info.plist embedded as a __TEXT,__info_plist section (no separate file)
        GENERATE_INFOPLIST_FILE: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: NO
        INFOPLIST_FILE: ""
        OTHER_LDFLAGS: "$(inherited) -sectcreate __TEXT __info_plist \"$(SRCROOT)/../FanControl/Support/Helper-Info.plist\""
        # Signing — ad hoc + Hardened Runtime (Xcode 26 ignores ENABLE_HARDENED_RUNTIME for "-",
        # hence the explicit --options=runtime)
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "$(inherited) --options=runtime"
        # Swift
        SWIFT_VERSION: "5.0"

  # MARK: - App
  DynamicNotch:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      # App code. Shared with the DynamicNotchApp test-support library below (YAML anchors).
      # Support/SettingsStorage.swift is a symlink to FanControlUI's internal
      # Storage/SettingsStore.swift: the app compiles its own copy of the store (internal to each
      # module), the CLT harness too. Sources/FanControlGlue/ (the Fan Control widgets, live
      # activity and Nook hooks on top of FanControlUI; docs/fan-control-integration.md) is compiled
      # here but excluded from the CLT harness, which does not link FanControl.
      - &appSources
        path: Sources
      # @main (App/DynamicNotchApp.swift) — app target only
      - path: App
      # Bundle resources: only this repository's own files.
      # App icon, generated by `swift Support/make-app-icon.swift`.
      - path: Support/DynamicNotchAppIcon.icns
        buildPhase: resources
        group: Resources
      # en.lproj only (English-only app, 2026-10-20), generated by Support/merge-strings.py
      - path: Localization
        buildPhase: resources
      # launchd plist for SMAppService (integration.md §3); file name must equal
      # FanControlHelperConstants.plistName
      - path: ../FanControl/Support/LaunchDaemons/com.example.dynamicnotch.DynamicNotch.fanfi.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      # Helper installer (FanControl/Support/manual-install/ + lib.sh + identifiers.sh, flat) in
      # Contents/Resources/manual-install/: run by Settings ▸ Fan Control ▸ General ▸ "Install
      # Helper…" (FanControlGlue/FanControlHelperInstallerAction.swift) and usable from Terminal,
      # `sudo …/Contents/Resources/manual-install/install.sh /Applications/DynamicNotch.app`
      # (docs/fan-control-integration.md "Helper installer"). The copy keeps the executable bits.
      # One copy-files phase for all eight files (a folder reference plus a second phase into the
      # same folder raced: the folder copy could replace the directory after lib.sh was copied).
      - path: ../FanControl/Support/manual-install/install.sh
        buildPhase: &manualInstallCopy
          copyFiles:
            destination: resources
            subpath: manual-install
      - path: ../FanControl/Support/manual-install/uninstall.sh
        buildPhase: *manualInstallCopy
      - path: ../FanControl/Support/manual-install/status.sh
        buildPhase: *manualInstallCopy
      - path: ../FanControl/Support/manual-install/common.sh
        buildPhase: *manualInstallCopy
      - path: ../FanControl/Support/manual-install/FanControlHelper.manual.plist
        buildPhase: *manualInstallCopy
      - path: ../FanControl/Support/manual-install/README.md
        buildPhase: *manualInstallCopy
      - path: ../FanControl/Support/lib.sh
        buildPhase: *manualInstallCopy
      - path: ../FanControl/Support/identifiers.sh
        buildPhase: *manualInstallCopy
    dependencies:
      - target: FanControlHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: FanControl
        product: FanControlCore
      - package: FanControl
        product: FanControlKit
      - package: FanControl
        product: FanControlUI     # settings pane, editors, chart, stored settings (Sources/FanControlGlue/ imports it)
      - package: MediaRemoteAdapter
        embed: true      # dynamic framework: copy into Contents/Frameworks (was loaded from DerivedData)
    scheme:
      # `xcodebuild -scheme DynamicNotch test` runs the unit tests (no UI tests).
      testTargets:
        - DynamicNotchAppTests
    info:
      path: Support/Info.plist
      properties:
        # Identity
        CFBundleName: DynamicNotch
        CFBundleDisplayName: DynamicNotch
        CFBundleIconFile: DynamicNotchAppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        # F4 automation surface: dynamicnotch:// command URLs (docs/automation.md, URLCommandRouter)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.dynamicnotch.DynamicNotch.automation
            CFBundleURLSchemes: [dynamicnotch]
            CFBundleTypeRole: Viewer
        # Privacy usage descriptions
        NSAppleEventsUsageDescription: "DynamicNotch controls media apps (Music, Spotify) and runs Shortcuts via Apple Events."
        NSBluetoothAlwaysUsageDescription: "DynamicNotch shows connected Bluetooth devices and their battery levels."
        NSBluetoothPeripheralUsageDescription: "DynamicNotch shows connected Bluetooth devices and their battery levels."
        NSCalendarsFullAccessUsageDescription: "DynamicNotch shows your upcoming calendar events in the notch."
        NSCalendarsWriteOnlyAccessUsageDescription: "DynamicNotch can add events to your calendar."
        NSCameraUsageDescription: "The Mirror widget shows your camera preview in the notch."
        NSDownloadsFolderUsageDescription: "The Downloads widget lists your recent downloads and their progress." # F8
        NSLocationUsageDescription: "The Weather widget uses your location to show the local forecast. With access, the Network widget can also show the Wi‑Fi network name."
        NSLocationWhenInUseUsageDescription: "The Weather widget uses your location to show the local forecast."
        NSMicrophoneUsageDescription: "The Audio widget shows the input level of your microphone."
        NSRemindersFullAccessUsageDescription: "The Reminders widget shows, adds and completes your reminders in the notch."
    entitlements:
      path: Support/DynamicNotch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true      # Audio widget input level meter
        com.apple.security.device.camera: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true   # Weather (current location), Network (SSID)
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        # Identity
        PRODUCT_NAME: DynamicNotch
        PRODUCT_MODULE_NAME: DynamicNotch
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dynamicnotch.DynamicNotch
        GENERATE_INFOPLIST_FILE: NO
        # Signing. Put your Apple Developer Team ID here (or in Xcode › Signing & Capabilities).
        # The same Team ID must later go into FanControl/Support/Helper-Info.plist
        # (FanControlClientTeamID) and FanControlHelperConstants.teamIdentifierPlaceholder.
        # With an empty team the app is signed ad hoc ("Sign to Run Locally"), which is
        # enough to build and run but NOT enough for the SMAppService privileged helper
        # (this Mac uses the manual helper install instead, FanControl/docs/helper.md §6).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        # Xcode 26 ignores ENABLE_HARDENED_RUNTIME for ad-hoc ("-") signing; pass it explicitly
        # (same recipe as FanControl/Tools/HelperSmokeApp).
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "$(inherited) --options=runtime"
        # Sandboxing — none (integration.md §4)
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Swift
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # Linking / packaging
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # Debug builds would otherwise split into a stub + DynamicNotch.debug.dylib, which library
        # validation refuses to load under ad-hoc signing + Hardened Runtime (no Team ID).
        ENABLE_DEBUG_DYLIB: NO
        # SWIFT_TREAT_WARNINGS_AS_ERRORS: not set. Xcode has no per-file Swift flags, so it cannot be
        # limited to the new widget files; the test target below sets it for Tests/**.

  # MARK: - Tests
  # Test-support library: the app code without App/ (no @main, no resources), so a host-less test
  # bundle can link it and the app is never launched (a hosted test would start a second
  # DynamicNotch next to the user's instance: notch windows, SMC reads, helper connection).
  DynamicNotchApp:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - *appSources
    dependencies:
      - package: FanControl
        product: FanControlCore
      - package: FanControl
        product: FanControlKit
      - package: FanControl
        product: FanControlUI     # imported by Sources/FanControlGlue/
      - package: MediaRemoteAdapter
    settings:
      base:
        PRODUCT_NAME: DynamicNotchApp
        PRODUCT_MODULE_NAME: DynamicNotchApp   # = the CLT harness library
        SKIP_INSTALL: YES
        ENABLE_TESTABILITY: YES
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal

  # Unit tests (Swift Testing): every file under Tests/ — the same files the CLT harness compiles
  # (Package.swift `DynamicNotchAppTests`). New suites (e.g. Tests/EngineTests/) need no edit here.
  DynamicNotchAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
        excludes:
          - "**/Fixtures"
          - "**/Fixtures/**"
    dependencies:
      - target: DynamicNotchApp
      - package: FanControl
        product: FanControlCore
      - package: FanControl
        product: FanControlKit
      - package: FanControl
        product: FanControlUI     # imported by Sources/FanControlGlue/
      - package: MediaRemoteAdapter
        embed: true      # dynamic framework, loaded from the bundle's Contents/Frameworks
    settings:
      base:
        PRODUCT_NAME: DynamicNotchAppTests
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dynamicnotch.DynamicNotchAppTests
        GENERATE_INFOPLIST_FILE: YES
        # host-less: no TEST_HOST / BUNDLE_LOADER (XcodeGen would otherwise not set them for a
        # bundle without an app dependency, but keep it explicit)
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../Frameworks"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
